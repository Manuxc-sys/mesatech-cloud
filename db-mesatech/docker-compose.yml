
services:
  db-mesatech:
    image: mysql:8.0
    container_name: db-mesatech
    ports:
      - "3306:3306" # Expuesto a la VPC de AWS (protegido por Security Group)
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=mesatech_db
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: